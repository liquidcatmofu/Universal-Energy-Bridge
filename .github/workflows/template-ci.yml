name: Template CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_JAVA_VERSION: '21'

jobs:
  template-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up build JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: ${{ env.BUILD_JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Initialize and build a generated mod
        shell: bash
        run: |
          set -euo pipefail
          test_root="$(mktemp -d)"
          cp -a . "$test_root/repo"
          cd "$test_root/repo"
          rm -rf .git

          ./init.sh test_tools 'Test "Tools"' com.example.testtools

          test -f src/main/java/com/example/testtools/TestTools.java
          test -f src/main/resources/test_tools.mixins.json
          test ! -e init.sh
          test ! -e .template
          test ! -e .github/workflows/template-ci.yml
          ! grep -R -F 'init.sh' .github/workflows

          old_mod_id='example''mod'
          old_class='Example''Mod'
          old_package="dev.liquidcatmofu.${old_mod_id}"

          for token in "$old_package" "$old_class" "$old_mod_id"; do
            if grep -R -F --exclude-dir=.gradle --exclude='gradle-wrapper.jar' -- "$token" .; then
              echo "::error::Template identifier remains after initialization: $token"
              exit 1
            fi
          done

          ./gradlew clean build --no-daemon --stacktrace
          jar='build/libs/TestTools-Forge-1.20.1-0.1.0.jar'
          test -f "$jar"
          unzip -p "$jar" META-INF/mods.toml | grep -Fq 'displayName="Test \"Tools\""'

      - name: Initialize a non-ASCII mod name
        shell: bash
        run: |
          set -euo pipefail
          test_root="$(mktemp -d)"
          cp -a . "$test_root/repo"
          cd "$test_root/repo"
          rm -rf .git

          ./init.sh benri_tools "便利ツール" com.example.benritools

          test -f src/main/java/com/example/benritools/BenriTools.java
          test -f src/main/resources/benri_tools.mixins.json
          grep -Fxq 'archives_name=BenriTools' gradle.properties
          grep -Fxq 'mod_name=便利ツール' gradle.properties
          test ! -e init.sh
          test ! -e .template
          test ! -e .github/workflows/template-ci.yml

      - name: Reject invalid initializer inputs
        shell: bash
        run: |
          set -euo pipefail

          assert_init_fails() {
            local mod_id="$1"
            local mod_name="$2"
            local package="$3"
            local case_root
            case_root="$(mktemp -d)"
            cp -a . "$case_root/repo"
            (
              cd "$case_root/repo"
              rm -rf .git
              if ./init.sh "$mod_id" "$mod_name" "$package"; then
                echo "::error::init.sh accepted invalid input: mod_id=$mod_id name=$mod_name package=$package"
                exit 1
              fi
            )
            rm -rf "$case_root"
          }

          assert_init_fails invalid "Invalid Package" dev.class.invalid
          assert_init_fails Bad-ID "Bad Mod Id" com.example.badid
          assert_init_fails valid_mod "Single Segment" singlepackage
          assert_init_fails valid_mod "Uppercase Package" com.Example.invalid
          assert_init_fails valid_mod "---" com.example.invalidname
          assert_init_fails valid_mod $'Bad\nName' com.example.invalidname
          assert_init_fails valid_mod 'Bad\Name' com.example.invalidname

      - name: Refuse collisions before modifying files
        shell: bash
        run: |
          set -euo pipefail
          test_root="$(mktemp -d)"
          cp -a . "$test_root/repo"
          cd "$test_root/repo"
          rm -rf .git

          mkdir -p src/main/java/com/example/collision

          tree_digest() {
            find . -type f               ! -path './.gradle/*'               ! -path './build/*'               ! -path './run/*'               -print0 |
              sort -z |
              xargs -0 sha256sum |
              sha256sum |
              cut -d' ' -f1
          }

          before="$(tree_digest)"
          if ./init.sh collision "Collision Test" com.example.collision; then
            echo "::error::init.sh accepted an existing destination package"
            exit 1
          fi
          after="$(tree_digest)"

          test "$before" = "$after"
          test -f init.sh
          test -d .template
          test -f .github/workflows/template-ci.yml
