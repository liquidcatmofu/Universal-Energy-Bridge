org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Mod properties
mod_version=0.1.0
maven_group=dev.liquidcatmofu.examplemod
archives_name=ExampleMod
mod_id=examplemod
mod_name=Example Mod
mod_authors=LiquidCatMofu
mod_license=All Rights Reserved
mod_description=An example Minecraft Forge mod.

# Release metadata used by .github/workflows/release.yml.
# mc-publish supports values such as: client, server, client | server.
publish_environment=client | server

# Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)

forge_version=47.4.10
forge_version_range=[47.4.10,48)
loader_version_range=[47,)

mapping_channel=official
mapping_version=1.20.1
