plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = maven_group
version = mod_version

base {
    archivesName = "${archives_name}-Forge-${minecraft_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://cursemaven.com' }
    maven { url = 'https://maven.covers1624.net/' }
    maven { url = 'https://chickenbones.net/maven/' }
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://dvs1.progwml6.com/files/maven/' }
    maven { url = 'https://modmaven.dev/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Optional integrations. These are compile-only; users only need the mods they actually bridge.
    compileOnly fg.deobf('curse.maven:flux-networks-248020:5234697')
    compileOnly fg.deobf('com.brandon3055.brandonscore:BrandonsCore:1.20.1-3.2.1.+:universal')
    compileOnly fg.deobf('io.codechicken:CodeChickenLib:1.20.1-4.4.0.+:universal')
    compileOnly fg.deobf('curse.maven:draconic-evolution-223565:6793843')
    compileOnly fg.deobf('curse.maven:mekanism-268560:6552911')
    compileOnly fg.deobf('curse.maven:applied-energistics-2-223794:6357138')
    compileOnly 'org.appliedenergistics:guideme:20.1.14'
    compileOnly fg.deobf('curse.maven:applied-flux-965012:7651647')
    compileOnly fg.deobf('curse.maven:glodium-957920:5226922')
    compileOnly fg.deobf('curse.maven:energymeter-532169:7676339')

    // Jade 1.20.1 API is bundled in the normal jar. Compile-only keeps Jade optional at runtime.
    compileOnly fg.deobf('curse.maven:jade-324717:8479276')
}

def tomlEscape = { value ->
    value.toString()
            .replace('\\', '\\\\')
            .replace('"', '\\"')
            .replace('\b', '\\b')
            .replace('\t', '\\t')
            .replace('\n', '\\n')
            .replace('\f', '\\f')
            .replace('\r', '\\r')
}

processResources {
    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            forge_version           : forge_version,
            forge_version_range     : forge_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name_toml           : tomlEscape(mod_name),
            mod_version             : mod_version,
            mod_authors_toml        : tomlEscape(mod_authors),
            mod_license_toml        : tomlEscape(mod_license),
            mod_description_toml    : tomlEscape(mod_description)
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'      : mod_id,
                'Specification-Vendor'     : mod_authors,
                'Specification-Version'    : '1',
                'Implementation-Title'     : project.name,
                'Implementation-Version'   : project.jar.archiveVersion,
                'Implementation-Vendor'    : mod_authors,
                'MixinConfigs'              : 'universal_energy_bridge.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}
